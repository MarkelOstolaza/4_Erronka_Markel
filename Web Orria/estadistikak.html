<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Estadistikak - Indiusurbil</title>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="Indiusurbil logoa" class="logo" />
                </a>
            </div>
            <ul class="menu">
                <li><a href="index.html">Orrialde nagusia</a></li>
                <li><a href="produktuak.html">Produktuak</a></li>
                <li><a href="estadistikak.html">Estadistikak</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <div class="carrito">
                <a href="saskia.html"><img src="img/cesta.png" alt="cesta" /> <span id="cuenta-carrito">0</span></a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Salmenten Estatistikak</h1>
        
        <div class="stats-grid">
            
            <div class="stat-card total-earnings">
                <h3>Irabazi Guztizkoak</h3>
                <p id="total-earnings-display" class="big-number">0€</p>
            </div>

            <div class="stat-card">
                <h3>Hileko Irabaziak</h3>
                <ul id="monthly-earnings-list"></ul>
            </div>

            <div class="stat-card warning">
                <h3>Stock Baxua (Arriskuan)</h3>
                <ul id="low-stock-list"></ul>
            </div>

            <div class="stat-card">
                <h3>Gehien Saldutakoak</h3>
                <ul id="top-products-list"></ul>
            </div>

            <div class="stat-card">
                <h3>Bezero Onenak</h3>
                <ul id="top-customers-list"></ul>
            </div>

            <div class="stat-card">
                <h3>Inoiz Saldu Gabeak</h3>
                <ul id="unsold-products-list"></ul>
            </div>

            <div class="stat-card">
                <h3>+500€ Irabaziak</h3>
                <ul id="high-revenue-list"></ul>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="oharlegalak">
            <a href="#">© 2026 Indiusurbil</a>
        </div>
    </footer>

    <script src="js/cartService.js"></script>
    <script src="js/estadistikak.js"></script>
</body>
</html>
